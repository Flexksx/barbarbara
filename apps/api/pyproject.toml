[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "api-core",
    "api-rest-contract",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.7", "ty>=0.0.80", "httpx>=0.28"]

[tool.uv.sources]
api-core = { path = "../../libs/api-core" }
api-rest-contract = { path = "../../libs/api-rest-contract" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
