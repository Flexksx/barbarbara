[project]
name = "api-rest-contract"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["pydantic>=2.11.7"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.7", "ty>=0.0.80"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_rest_contract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
